name: Construir e implantar imagem Docker

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: mavi-production
  cancel-in-progress: true

jobs:
  implantacao:
    runs-on: ubuntu-latest
    container:
      image: docker.gitea.com/runner-images:ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      APP_IMAGE: mavi:${{ gitea.sha }}
      APP_PORT: ${{ vars.APP_PORT || '3001' }}
      DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
      NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
      NUXT_DATABASE_ADMIN_URL: ${{ secrets.NUXT_DATABASE_ADMIN_URL }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      COOKIE_SECURE: ${{ vars.COOKIE_SECURE || 'true' }}
      TRUST_PROXY: ${{ vars.TRUST_PROXY || 'true' }}

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Validar segredos obrigatórios
        shell: bash
        run: |
          set -eu
          test -n "$NUXT_DATABASE_URL" || { echo "O segredo NUXT_DATABASE_URL é obrigatório"; exit 1; }
          test -n "$JWT_ACCESS_SECRET" || { echo "O segredo JWT_ACCESS_SECRET é obrigatório"; exit 1; }
          test -n "$JWT_REFRESH_SECRET" || { echo "O segredo JWT_REFRESH_SECRET é obrigatório"; exit 1; }
          test -n "$APP_ORIGIN" || { echo "A variável APP_ORIGIN é obrigatória"; exit 1; }

      - name: Validar Docker do runner
        shell: bash
        run: |
          set -eu
          command -v docker >/dev/null || { echo "O comando docker não está instalado no runner"; exit 1; }
          docker info >/dev/null || { echo "O runner não possui acesso ao daemon do Docker"; exit 1; }

      - name: Construir imagem
        run: docker build --pull --tag "$APP_IMAGE" .

      - name: Implantar container
        shell: bash
        run: |
          set -eu
          argumentos_rede=()
          if [ -n "${DOCKER_NETWORK:-}" ]; then
            docker network inspect "$DOCKER_NETWORK" >/dev/null || {
              echo "A rede Docker $DOCKER_NETWORK não existe"
              exit 1
            }
            argumentos_rede=(--network "$DOCKER_NETWORK")
          fi

          docker rm --force mavi-store-app >/dev/null 2>&1 || true
          docker rm --force mavi-store_app_1 >/dev/null 2>&1 || true
          docker run --detach \
            --name mavi-store-app \
            --restart unless-stopped \
            "${argumentos_rede[@]}" \
            --publish "${APP_PORT}:3000" \
            --env NUXT_DATABASE_URL \
            --env NUXT_DATABASE_ADMIN_URL \
            --env NUXT_JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
            --env NUXT_JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            --env NUXT_COOKIE_SECURE="$COOKIE_SECURE" \
            --env NUXT_APP_ORIGIN="$APP_ORIGIN" \
            --env NUXT_TRUST_PROXY="$TRUST_PROXY" \
            --env NUXT_APP_TIME_ZONE="America/Sao_Paulo" \
            --env TZ="America/Sao_Paulo" \
            "$APP_IMAGE"

      - name: Verificar saúde da aplicação
        shell: bash
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if docker exec mavi-store-app node -e \
              "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "Aplicação saudável"
              exit 0
            fi
            sleep 2
          done
          docker logs --tail=100 mavi-store-app
          exit 1

      - name: Limpar imagens Docker antigas
        run: docker image prune --all --force --filter "until=168h"
