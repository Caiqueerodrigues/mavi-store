services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calcados}
      POSTGRES_USER: ${POSTGRES_USER:-calcados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calcados}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calcados} -d ${POSTGRES_DB:-calcados}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: postgres://${POSTGRES_USER:-calcados}:${POSTGRES_PASSWORD:-calcados}@db:5432/${POSTGRES_DB:-calcados}
      NUXT_JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      NUXT_JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NUXT_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      NUXT_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NUXT_APP_TIME_ZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
