services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL}
      NUXT_DATABASE_ADMIN_URL: ${NUXT_DATABASE_ADMIN_URL}
      NUXT_JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      NUXT_JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NUXT_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      NUXT_ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME:-Caique Rodrigues Almeida}
      NUXT_ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-caiquerodriguesalmeida@gmail.com}
      NUXT_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NUXT_APP_ORIGIN: ${APP_ORIGIN}
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}
      NUXT_APP_TIME_ZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "${APP_PORT:-3001}:3000"
